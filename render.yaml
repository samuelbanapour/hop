services:
  - type: web
    name: hopcli-site
    runtime: static
    staticPublishPath: site
    buildCommand: echo "static site, no build step"
    plan: free
    pullRequestPreviewsEnabled: false
    routes:
      - type: rewrite
        source: /*
        destination: /index.html
    headers:
      - path: /*
        name: Cache-Control
        value: public, max-age=300
